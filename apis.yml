aid: helaina
name: Helaina
description: >-
  Helaina is a New York based biotechnology and nutrition company that uses precision fermentation
  to produce bio-identical human proteins. Its flagship ingredient, effera(R), is described by the
  company as the world's first bio-identical human lactoferrin, designed to match the lactoferrin
  naturally found in mother's milk and in the human body rather than being extracted from cow's
  milk. Helaina sells effera(R) as a business-to-business ingredient to supplement and nutrition
  formulators across women's health, gut health, longevity, hair and skin, active nutrition, and
  infant and child nutrition, and has announced a partnership with Nestle to advance science-based
  early-life nutrition. Helaina is an ingredient manufacturer, not a software vendor: it publishes
  no public API, developer portal, SDK, or machine-readable API specification. The only
  machine-readable surface it publishes is an llms.txt at its website root, alongside a robots.txt
  that explicitly allows AI answer engines.
